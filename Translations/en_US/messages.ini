mautic.patches.perf.verdict.db_slow_queries.detail="Most of the time is spent in SQL, with few queries per request. Look at the slowest requests below for the heavy query, then run the diagnostics (missing index, full table scan, undersized database)."
mautic.patches.perf.verdict.db_many_queries="The database is the bottleneck: too many queries per request"
mautic.patches.perf.verdict.db_many_queries.detail="Each request runs dozens of queries (typical of one query per row). It will get worse as the data grows. Ask for fewer rows per call, or a leaner way to read the data."
mautic.patches.perf.verdict.app="The time is in the application or the server, not the database"
mautic.patches.perf.verdict.app.detail="SQL is a small part of each request. Check the server load in the diagnostics (CPU, PHP workers, memory) and whether PHP opcache is on."
mautic.patches.perf.verdict.mixed="Time is split between the database and the application"
mautic.patches.perf.verdict.mixed.detail="No single culprit. Check the heaviest routes below and the diagnostics."
