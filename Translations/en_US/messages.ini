mautic.patches.perf.hint.db_ping="Over 5 ms for a trivial query points to the network between Mautic and the database, or an overloaded database server."
mautic.patches.perf.hint.load="The server is busy. If it stays high, the slowness is not the query: add CPU or PHP workers, or find what else runs there (cron, workers)."
mautic.patches.perf.hint.mysql_denied="The database user cannot read the server settings. Ask the database admin."
mautic.patches.perf.hint.connections="Close to the connection limit: requests may wait for a free connection."
mautic.patches.perf.hint.buffer_pool="The data is bigger than the memory MySQL uses for it, so reads go to disk. Raise innodb_buffer_pool_size."
mautic.patches.perf.hint.slow_log="Turn on slow_query_log (long_query_time 0.5) at the database to keep every slow query."
mautic.patches.perf.hint.scan="Slow or full table scan: an index is probably missing. Send this line to whoever maintains the database."
